# /about 对话式自我介绍配置（支持分支对话，预留 AI 接口扩展位）
title: 关于 Yuk1n0
subtitle: Interactive Profile · Dialogue Mode
description: 以对话的方式认识 Yuk1n0——基于旧站 BotUI 对话重构，支持继续扩展分支或接入大模型接口。

profile:
  name: Yuk1n0
  role: NLP · Deep Learning · Photography · Japanese
  status: 探索构建与记录中
  location: Tokyo / Beijing
  # 头像路径（相对 content/assets/）
  avatar: photos/DSCF1373.jpg
  links:
    - label: GitHub
      url: https://github.com/Yuk1n0sh1ta
    - label: Bilibili
      url: https://space.bilibili.com/39873026
